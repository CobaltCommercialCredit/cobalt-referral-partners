<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cobalt Referral Partner Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #F3F4F2; --surface: #FFFFFF; --surface-sunk: #ECEDEA;
    --ink: #15171C; --ink-soft: #565C68; --ink-faint: #8B909B; --line: #DDE0E3;
    --cobalt: #0047AB; --cobalt-dark: #003580; --cobalt-tint: #E7EDF9;
    --amber: #B4750E; --amber-tint: #FBF0DD;
    --green: #1B7A43; --green-tint: #E4F3E9;
    --red: #A32A2A; --red-tint: #F7E7E5;
    --grey-tint: #EEEFEE;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(21,23,28,0.04), 0 8px 24px -12px rgba(21,23,28,0.12);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-feature-settings:'tnum' 1; font-variant-numeric: tabular-nums; }
  .display{ font-family:'Source Serif 4', Georgia, serif; }
  .wrap{ max-width:1320px; margin:0 auto; padding:28px 28px 80px; }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand h1{ font-size:20px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .brand p{ margin:1px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:8px;
    font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, background .15s; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .btn-primary:hover{ background:var(--cobalt-dark); border-color:var(--cobalt-dark); }
  .btn-ghost{ border-color:transparent; background:transparent; color:var(--ink-soft); padding:9px 10px; }
  .btn-ghost:hover{ background:var(--surface-sunk); color:var(--ink); }
  .btn-danger{ color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .summary{ display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .summary .cell{ background:var(--surface); padding:14px 16px; }
  .summary .num{ font-family:'Source Serif 4',serif; font-size:24px; font-weight:600; line-height:1; }
  .summary .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; text-transform:uppercase; letter-spacing:.05em; }
  .summary .num.warn{ color:var(--amber); }
  .summary .num.accent{ color:var(--cobalt); }

  .filterbar{ display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .filterbar select, .filterbar input[type=text]{ padding:8px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px;
    font-family:inherit; background:var(--surface); color:var(--ink); }
  .filterbar input[type=text]{ min-width:220px; }
  .filterbar .spacer{ flex:1; }
  .count-pill{ font-size:12px; color:var(--ink-soft); }

  .tablewrap{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);
    padding:11px 14px; background:var(--surface-sunk); border-bottom:1px solid var(--line); font-weight:600; white-space:nowrap; cursor:pointer; }
  thead th:hover{ color:var(--ink); }
  thead th.sorted{ color:var(--cobalt); }
  tbody tr{ border-bottom:1px solid var(--line); }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  td{ padding:8px 10px; vertical-align:middle; }
  .partner-name{ font-weight:600; max-width:190px; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge.type{ background:var(--cobalt-tint); color:var(--cobalt-dark); }

  select.compact-select{ font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-family:inherit; background:var(--surface); }
  input.compact-input{ font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-family:inherit; width:90px; }
  input.touch-date{ font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-family:inherit; width:112px; }
  .overdue{ color:var(--red); font-weight:600; }

  select.status-select{ font-size:12px; font-weight:600; padding:5px 8px; border-radius:6px; border:1px solid var(--line); font-family:inherit; background:var(--surface); }
  .st-Prospecting{ background:var(--grey-tint); border-color:var(--grey-tint); }
  .st-Contacted{ background:var(--amber-tint); border-color:var(--amber-tint); color:var(--amber); }
  .st-Active{ background:var(--green-tint); border-color:var(--green-tint); color:var(--green); }
  .st-Dormant{ background:var(--cobalt-tint); border-color:var(--cobalt-tint); color:var(--cobalt-dark); }
  .st-Terminated{ background:var(--red-tint); border-color:var(--red-tint); color:var(--red); }

  .row-actions{ display:flex; gap:4px; }
  .icon-btn{ background:transparent; border:none; color:var(--ink-faint); padding:5px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--surface-sunk); color:var(--ink); }

  .notes-row td{ background:#FAFBFC; padding:0 14px 14px; }
  .link-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .link-row input{ flex:1; min-width:200px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; font-family:inherit; }
  .link-results{ position:relative; }
  .link-dropdown{ position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:8px;
    box-shadow:var(--shadow); z-index:20; max-height:180px; overflow-y:auto; }
  .link-dropdown div{ padding:8px 10px; font-size:12.5px; cursor:pointer; }
  .link-dropdown div:hover{ background:var(--surface-sunk); }
  .linked-list{ margin-bottom:14px; }
  .linked-item{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12.5px;
    display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .notes-log{ max-height:140px; overflow-y:auto; margin-bottom:8px; }
  .note-entry{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12.5px; }
  .note-entry .meta{ font-size:10.5px; color:var(--ink-faint); margin-bottom:3px; }
  .note-add-row{ display:flex; gap:8px; align-items:flex-start; }
  .note-add-row textarea{ flex:1; min-height:44px; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:12.5px; resize:vertical; }

  .empty{ text-align:center; padding:70px 20px; color:var(--ink-soft); }
  .empty .display{ font-size:22px; color:var(--ink); margin-bottom:8px; }
  .empty p{ max-width:420px; margin:0 auto 18px; font-size:13.5px; line-height:1.5; }

  .overlay{ position:fixed; inset:0; background:rgba(21,23,28,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal{ background:var(--surface); border-radius:14px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -20px rgba(0,0,0,0.35); }
  .modal-head{ padding:20px 24px 4px; }
  .modal-head h2{ font-size:18px; margin:0 0 4px; }
  .modal-head p{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .modal-body{ padding:14px 24px 20px; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px 22px; gap:10px; }
  .field-block{ margin-bottom:14px; }
  .field-block label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; }
  .field-block input, .field-block select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:inherit; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
    border-radius:8px; font-size:12.5px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .authgate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:500; padding:24px; }
  .authcard{ background:var(--surface); border:1px solid var(--line); border-radius:14px; width:100%; max-width:380px; padding:28px 28px 24px; box-shadow:var(--shadow); }
  .authcard h1{ font-size:20px; margin:0 0 3px; }
  .authcard p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px; }
  .authcard label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; margin-top:14px; }
  .authcard input{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; box-sizing:border-box; }
  .authcard .btn-primary{ width:100%; justify-content:center; margin-top:18px; padding:10px; }
  .authcard .err{ font-size:12.5px; color:var(--red); margin-top:10px; display:none; }
  .authcard .err.show{ display:block; }

  #fileInput{ display:none; }
  ::selection{ background:var(--cobalt-tint); }
</style>
</head>
<body>

<div class="authgate" id="authGate">
  <div class="authcard">
    <h1 class="display" id="authTitle">Sign in</h1>
    <p class="sub">Cobalt Referral Partner Tracker — for the team only.</p>
    <label>Email</label>
    <input type="email" id="authEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button class="btn btn-primary" id="authSubmit">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="150 280 185 208" xmlns="http://www.w3.org/2000/svg" width="34" height="34">
          <polygon fill="#1a4b8c" points="242.74669 285.5804 256.15816 374.10946 327.42649 334.47028"/>
          <polygon fill="#4a7fc4" points="329.32111 430.70878 329.32111 335.56417 258.07371 383.13647"/>
          <polygon fill="#002347" points="154.63524 335.56417 154.63524 430.70878 225.88271 383.13647"/>
          <polygon fill="#0047ab" points="227.7982 374.10946 241.20966 285.5804 156.52986 334.47028"/>
          <polygon fill="#0047ab" points="227.7982 392.16349 155.13954 432.57591 241.4713 482.4196"/>
          <polygon fill="#1a4b8c" points="256.15816 392.16349 242.48506 482.4196 328.81682 432.57591"/>
        </svg>
      </div>
      <div>
        <h1 class="display">Cobalt Referral Partner Tracker</h1>
        <p>Banks, brokers, and COIs — who's actually producing</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost btn-danger" id="clearBtn">Clear all data</button>
      <button class="btn btn-ghost" id="importBackupBtn">Import backup</button>
      <button class="btn btn-ghost" id="exportBackupBtn">Export backup</button>
      <button class="btn btn-ghost" id="exportSelectedBtn">Export selected</button>
      <button class="btn btn-ghost btn-danger" id="deleteSelectedBtn">Delete selected</button>
      <button class="btn btn-primary" id="addPartnerBtn">+ Add partner</button>
      <select id="toolSwitcher" class="btn" style="cursor:pointer;">
        <option value="">Switch tool…</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-hub/">🏠 Cobalt Terminal</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-prospect-engine/">Cobalt CRE Prospecting</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-debt-deals/">Cobalt Credit Prospecting</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-slb-calculator/">SLB Calculator</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-debt-capacity-calc/">Debt Capacity Calculator</option>
        <option value="https://cobaltcommercialcredit.github.io/cobalt-treasury-audit/">Treasury Firepower Audit</option>
      </select>
      <button class="btn btn-ghost signout-btn" id="signOutBtn">Sign out</button>
      <input type="file" id="backupInput" accept=".json">
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="filterbar">
    <select id="filterType"><option value="">All types</option></select>
    <select id="filterStatus"><option value="">All statuses</option></select>
    <select id="filterAssigned"><option value="">Everyone</option></select>
    <input type="text" id="searchBox" placeholder="Search partner, contact, phone, email...">
    <button class="btn" id="refreshBtn">Refresh</button>
    <div class="spacer"></div>
    <span class="count-pill" id="countPill"></span>
  </div>

  <div class="tablewrap" id="tableWrap"></div>

</div>

<div class="overlay" id="addOverlay" style="display:none;">
  <div class="modal">
    <div class="modal-head">
      <h2 class="display">Add a referral partner</h2>
      <p>Bank, broker, or center of influence.</p>
    </div>
    <div class="modal-body">
      <div class="field-block"><label>Partner / organization name *</label><input type="text" id="addPartnerName"></div>
      <div class="field-block"><label>Partner type</label><select id="addPartnerType"></select></div>
      <div class="field-block"><label>Status</label><select id="addStatus"></select></div>
      <div class="field-block"><label>Contact name</label><input type="text" id="addContactName"></div>
      <div class="field-block"><label>Phone</label><input type="text" id="addPhone"></div>
      <div class="field-block"><label>Email</label><input type="text" id="addEmail"></div>
      <div class="field-block"><label>Assigned to</label><select id="addAssignedTo"></select></div>
    </div>
    <div class="modal-foot">
      <span></span>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="confirmAdd">Add partner</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var PARTNER_TYPES = ['', 'Bank', 'COI – Attorney', 'COI – CPA', 'COI – Wealth Advisor', 'Broker', 'Other'];
  var STATUSES = ['Prospecting','Contacted','Active','Dormant','Terminated'];
  var STATUS_CLASS = { 'Prospecting':'st-Prospecting','Contacted':'st-Contacted','Active':'st-Active','Dormant':'st-Dormant','Terminated':'st-Terminated' };
  var ASSIGNEES = ['', 'Curtis', 'Armen', 'Lina'];

  var state = {
    partners: [],
    filters: { type:'', status:'', assigned:'', search:'' },
    sort: { key:'partner_name', dir:'asc' },
    expanded: {},
    selected: {},
    session: null,
    linkedCache: {}
  };

  function $(id){ return document.getElementById(id); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, 2400); }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function formatWhen(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return ''; return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

  // ---------- Supabase (same project — same logins work everywhere) ----------
  var SUPABASE_URL = 'https://pdqywwxyibnapeytoalk.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_gAk4DGF0YlBxFQkcO92reQ_cb9H91lQ';
  var REST = SUPABASE_URL + '/rest/v1';
  var AUTH = SUPABASE_URL + '/auth/v1';

  function sbHeaders(extra){
    var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
    if(state.session && state.session.access_token){ h['Authorization'] = 'Bearer ' + state.session.access_token; }
    return Object.assign(h, extra||{});
  }
  async function authSignIn(email, password){
    var res = await fetch(AUTH+'/token?grant_type=password', { method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ email:email, password:password }) });
    var data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
    return data;
  }
  async function authRefresh(refreshToken){
    var res = await fetch(AUTH+'/token?grant_type=refresh_token', { method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token:refreshToken }) });
    var data = await res.json();
    if(!res.ok) throw new Error('refresh failed');
    return data;
  }
  function saveSession(data){
    state.session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in||3600)*1000, email: data.user && data.user.email };
    try{ localStorage.setItem('cobalt_session', JSON.stringify(state.session)); }catch(e){}
  }
  function loadStoredSession(){
    try{ var raw = localStorage.getItem('cobalt_session'); if(raw) state.session = JSON.parse(raw); }catch(e){ state.session = null; }
  }
  function clearSession(){
    state.session = null;
    try{ localStorage.removeItem('cobalt_session'); }catch(e){}
  }
  async function ensureValidSession(){
    if(!state.session) return false;
    if(Date.now() < state.session.expires_at - 60000) return true;
    try{ saveSession(await authRefresh(state.session.refresh_token)); return true; }
    catch(e){ clearSession(); return false; }
  }

  function toDbRow(p){
    return {
      id: p.id, partner_name: p.partnerName, partner_type: p.partnerType, contact_name: p.contactName,
      phone: p.phone, email: p.email, assigned_to: p.assignedTo, status: p.status,
      next_touch_date: p.nextTouchDate, last_touch_date: p.lastTouchDate, notes_log: p.notesLog || [], created_at: p.createdAt
    };
  }
  function fromDbRow(row){
    return {
      id: row.id, partnerName: row.partner_name, partnerType: row.partner_type, contactName: row.contact_name,
      phone: row.phone, email: row.email, assignedTo: row.assigned_to, status: row.status,
      nextTouchDate: row.next_touch_date, lastTouchDate: row.last_touch_date, notesLog: row.notes_log || [], createdAt: row.created_at
    };
  }
  async function fetchAllPartners(){
    var res = await fetch(REST+'/referral_partners?select=*', { headers: sbHeaders() });
    if(!res.ok) throw new Error('fetch failed');
    return (await res.json()).map(fromDbRow);
  }
  async function upsertPartnersRemote(records){
    if(!records.length) return;
    var res = await fetch(REST+'/referral_partners', {
      method:'POST', headers: sbHeaders({ 'Prefer':'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(records.map(toDbRow))
    });
    if(!res.ok) throw new Error('upsert failed');
  }
  async function patchPartnerRemote(id, fields){
    var res = await fetch(REST+'/referral_partners?id=eq.'+encodeURIComponent(id), {
      method:'PATCH', headers: sbHeaders({ 'Prefer':'return=minimal' }), body: JSON.stringify(fields)
    });
    if(!res.ok) throw new Error('patch failed');
  }
  async function deletePartnersRemote(ids){
    var filterVal = ids.map(encodeURIComponent).join(',');
    var res = await fetch(REST+'/referral_partners?id=in.('+filterVal+')', { method:'DELETE', headers: sbHeaders({'Prefer':'return=minimal'}) });
    if(!res.ok) throw new Error('bulk delete failed');
  }
  async function deleteAllPartnersRemote(){
    var res = await fetch(REST+'/referral_partners?id=not.is.null', { method:'DELETE', headers: sbHeaders({'Prefer':'return=minimal'}) });
    if(!res.ok) throw new Error('delete all failed');
  }

  // ---------- searching and linking prospects/deals to a partner ----------
  async function searchProspects(term){
    try{
      var res = await fetch(REST+'/prospects?owner_name=ilike.*'+encodeURIComponent(term)+'*&select=id,owner_name,situs_address&limit=8', { headers: sbHeaders() });
      if(!res.ok) return [];
      return await res.json();
    }catch(e){ return []; }
  }
  async function searchDeals(term){
    try{
      var res = await fetch(REST+'/debt_deals?company_name=ilike.*'+encodeURIComponent(term)+'*&select=id,company_name,stage&limit=8', { headers: sbHeaders() });
      if(!res.ok) return [];
      return await res.json();
    }catch(e){ return []; }
  }
  async function linkProspectToPartner(prospectId, prospectName, partner){
    var res = await fetch(REST+'/prospects?id=eq.'+encodeURIComponent(prospectId), {
      method:'PATCH', headers: sbHeaders({ 'Prefer':'return=minimal' }),
      body: JSON.stringify({ referral_partner_id: partner.id, referral_partner_name: partner.partnerName })
    });
    if(!res.ok) throw new Error('link failed');
  }
  async function linkDealToPartner(dealId, dealName, partner){
    var res = await fetch(REST+'/debt_deals?id=eq.'+encodeURIComponent(dealId), {
      method:'PATCH', headers: sbHeaders({ 'Prefer':'return=minimal' }),
      body: JSON.stringify({ referral_partner_id: partner.id, referral_partner_name: partner.partnerName })
    });
    if(!res.ok) throw new Error('link failed');
  }
  async function unlinkProspect(prospectId){
    await fetch(REST+'/prospects?id=eq.'+encodeURIComponent(prospectId), {
      method:'PATCH', headers: sbHeaders({ 'Prefer':'return=minimal' }),
      body: JSON.stringify({ referral_partner_id: null, referral_partner_name: null })

        var payload = JSON.parse(evt.target.result);

        if(!Array.isArray(incoming)) throw new Error('bad format');
        var byId = {}; state.partners.forEach(function(p){ byId[p.id]=p; });
        var added=0, updated=0, touched=[];
        incoming.forEach(function(p){

        try{ await upsertPartnersRemote(touched); }catch(e){ toast('Restored locally, sync failed'); }
        renderAll(); toast('Restored: '+added+' added, '+updated+' updated');

    ].map(function(c){ return '<div class="cell"><div class="num '+c[2]+'">'+c[1]+'</div><div class="lbl">'+c[0]+'</div></div>'; }).join('');
  }

  function getFilteredSorted(){
    var f = state.filters;
    var rows = state.partners.filter(function(p){
      if(f.type && p.partnerType!==f.type) return false;
      if(f.status && p.status!==f.status) return false;
      if(f.assigned && p.assignedTo!==f.assigned) return false;
      if(f.search){
        var hay = [p.partnerName,p.contactName,p.phone,p.email].join(' ').toLowerCase();
        if(hay.indexOf(f.search)===-1) return false;
      }
      return true;
    });
    var key = state.sort.key, dir = state.sort.dir==='asc'?1:-1;
    rows.sort(function(a,b){
      var av=a[key], bv=b[key];
      if(key==='nextTouchDate'){ av=av||'9999'; bv=bv||'9999'; }
      if(typeof av==='string') av=(av||'').toLowerCase();
      if(typeof bv==='string') bv=(bv||'').toLowerCase();
      if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
    });
    return rows;
  }

        if(!btn) return;
        var tr = list.closest('tr').previousElementSibling;
        var partnerId = tr ? tr.getAttribute('data-id') : null;
        var rec = state.partners.find(function(p){ return p.id===partnerId; });
        if(btn.getAttribute('data-act')==='unlinkprospect'){
          await unlinkProspect(btn.getAttribute('data-pid'));
        } else {
          await unlinkDeal(btn.getAttribute('data-did'));
        }
        if(rec) await loadLinkedFor(rec);
        toast('Unlinked');
      });
    });
  }

  function renderAll(){ renderSummary(); renderTable(); }

  async function loadAppData(){
    $('tableWrap').innerHTML = '<div class="empty"><div class="display">Loading…</div><p>Connecting to the database.</p></div>';
    try{ state.partners = await fetchAllPartners(); }
    catch(e){ toast('Could not connect to the database — check your connection and refresh'); }
    renderAll();
  }
  async function enterApp(){
    $('authGate').style.display = 'none';
    $('mainApp').style.display = 'block';
    await loadAppData();
  }

  (async function init(){
    loadStoredSession();
    var ok = await ensureValidSession();
    if(ok){ await enterApp(); }
    else { $('authGate').style.display = 'flex'; $('mainApp').style.display = 'none'; }
  })();
})();
</script>
</body>
</html>
